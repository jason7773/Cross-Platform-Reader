name: CI

on:
  push:
  pull_request:

jobs:
  reader-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
